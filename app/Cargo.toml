[package]
name = "masse"
version = "0.9.0"
edition = "2021"

[dependencies]
tao = "0.35"
wry = "0.55"
muda = "0.19"
# Only so --fire-menu can drive real AppKit menu activations. Versions pinned to
# match what tao already pulls in, to avoid two copies of objc2 in the tree.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
